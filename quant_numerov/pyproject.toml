[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numerov_project"
version = "0.1.0"
description = "A modular 1D Schrödinger solver using the Numerov method"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]