name: Run Tests

# 1. Trigger: When should this run?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. The Job: What to do?
jobs:
  build:
    runs-on: ubuntu-latest  # Rent a Linux machine (free)

    steps:
    # A. Check out the code from the repo
    - uses: actions/checkout@v4

    # B. Install Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # C. Install your library
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .  # Installs your package in "editable" mode

    # D. Run the tests
    - name: Run Pytest
      run: |
        pytest